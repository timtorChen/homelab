---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  namespace: ntfy
  name: ntfy-postgres
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:15.6
  instances: 1
  serviceAccountTemplate:
    metadata:
      annotations:
        eks.amazonaws.com/audience: sts.amazonaws.com
        eks.amazonaws.com/role-arn: arn:aws:iam::262264826613:role/ntfy-postgres
  storage:
    pvcTemplate:
      storageClassName: rbd-fast
      resources:
        requests:
          storage: 10Gi
      accessModes: ["ReadWriteOnce"]
  bootstrap:
    initdb:
      database: ntfy
      owner: ntfy
      secret:
        name: ntfy-postgres-secret
  backup:
    retentionPolicy: "2w"
    barmanObjectStore:
      endpointURL: https://s3.us-east-005.backblazeb2.com
      destinationPath: s3://timtor-homelab-ntfy/
      s3Credentials:
        accessKeyId:
          name: ntfy-postgres-secret
          key: POSTGRES_B2_ACCESS_KEY_ID
        secretAccessKey:
          name: ntfy-postgres-secret
          key: POSTGRES_B2_ACCESS_SECRET_KEY
      wal:
        compression: gzip
        maxParallel: 8
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/postgresql.cnpg.io/scheduledbackup_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  namespace: ntfy
  name: ntfy-postgres-backup
spec:
  schedule: "0 0 0/12 * *"
  backupOwnerReference: self
  cluster:
    name: ntfy-postgres
  target: prefer-standby
