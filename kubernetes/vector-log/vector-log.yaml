---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/source.toolkit.fluxcd.io/helmrepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  namespace: vector-log
  name: bjw-s
spec:
  url: https://bjw-s-labs.github.io/helm-charts
  interval: 24h
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  namespace: vector-log
  name: vector-log
spec:
  chart:
    spec:
      sourceRef:
        kind: HelmRepository
        name: bjw-s
      chart: app-template
      version: 3.7.3
  interval: 1h
  maxHistory: 1
  timeout: 1m0s
  values:
    controllers:
      main:
        type: daemonset
        strategy: RollingUpdate
        serviceAccount:
          name: vector-log
        pod:
          tolerations:
            - operator: Exists
        annotations:
          configmap.reloader.stakater.com/reload: &config vector-log-config
        containers:
          main:
            image:
              repository: timberio/vector
              tag: 0.59.0-distroless-libc
            env:
              VECTOR_CONFIG_DIR: &config-dir /etc/vector
              VECTOR_SELF_NODE_NAME:
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            resources:
              limits:
                memory: 128Mi
              requests:
                cpu: 50m
                memory: 128Mi
            probes:
              startup:
                enabled: false
              liveness:
                enabled: false
              readiness:
                enabled: false
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
              seccompProfile:
                type: RuntimeDefault

    persistence:
      config:
        type: configMap
        name: *config
        globalMounts:
          - path: *config-dir
            readOnly: true
      pod-logs:
        type: hostPath
        hostPath: /var/log/pods
        hostPathType: Directory
        globalMounts:
          - path: /var/log/pods
            readOnly: true
      data:
        type: hostPath
        hostPath: /var/lib/vector-log
        hostPathType: DirectoryOrCreate
        globalMounts:
          - path: /var/lib/vector
