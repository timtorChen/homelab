---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"
silent: true

includes:
  cnpg:
    taskfile: ../../.tasks/cnpg.yaml

tasks:
  backup:
    deps:
      - task: backup-data
      - task: cnpg:backup
        vars:
          NAMESPACE: immich-public
          NAME: immich-public-postgres

  backup-data:
    internal: true
    cmd: argo submit -n immich-public --from workflowtemplate/immich-public-data-backup-manual --watch

  restore:
    prompt: |
      Immich volume is shared with nextcloud, remember to stop the nextcloud before proceeding.
      Restore will delete current immich-public data and database... continue?
    cmds:
      - task: stop
      - task: delete-volume
      - task: cnpg:delete
        vars:
          NAMESPACE: immich-public
          NAME: immich-public-postgres
      - task: create-volume
      - cmd: |
          echo -n "Please enter the target time for postgres recovery (leave blank for latest): "
          read RESTORE_TIME
          if [ -n "$RESTORE_TIME" ]; then
            FORMAT="%Y-%m-%d %H:%M:%S%:::z"
            if [ "{{OS}}" = "linux" ]; then
              PARSE="$(date --date "$RESTORE_TIME" +"$FORMAT")"
              RESTORE_TARGET="$(date -u --date "$PARSE" +"$FORMAT")"
            elif [ "{{OS}}" = "darwin" ]; then
              PARSE="$(gdate --date "$RESTORE_TIME" +"$FORMAT")"
              RESTORE_TARGET="$(gdate -u --date "$PARSE" +"$FORMAT")"
            else
              echo "Unsupported OS: {{OS}}"
              exit 1
            fi
            if [ -z "$RESTORE_TARGET" ]; then
              echo "Invalid recovery target time"
              exit 1
            fi
            argo submit -n immich-public --from workflowtemplate/immich-public-postgres-restore-manual \
              -p "targetTime=$RESTORE_TARGET" --watch
          else
            argo submit -n immich-public --from workflowtemplate/immich-public-postgres-restore-manual --watch
          fi
      - cmd: argo submit -n immich-public --from workflowtemplate/immich-public-data-restore-manual --watch
      - task: start

  delete-volume:
    internal: true
    ignore_error: true
    cmd: |
      echo "Deleting immich-public volume claim..."
      kubectl delete -f app/pvc.yaml

  create-volume:
    internal: true
    cmd: |
      echo "Creating immich-public volume claim..."
      kubectl create -f app/pvc.yaml

  stop:
    cmd: |
      echo "Stopping immich-public..."
      kubectl scale --replicas 0 -n immich-public deployment/immich-public-machine-learning
      kubectl scale --replicas 0 -n immich-public deployment/immich-public-server
      kubectl scale --replicas 0 -n immich-public deployment/immich-public-microservices

  start:
    cmd: |
      echo "Starting immich-public..."
      kubectl scale --replicas 1 -n immich-public deployment/immich-public-machine-learning
      kubectl scale --replicas 1 -n immich-public deployment/immich-public-server
      kubectl scale --replicas 1 -n immich-public deployment/immich-public-microservices

  stop-postgres:
    cmds:
      - task: cnpg:stop
        vars:
          NAMESPACE: immich-public
          NAME: immich-public-postgres

  start-postgres:
    cmds:
      - task: cnpg:start
        vars:
          NAMESPACE: immich-public
          NAME: immich-public-postgres

  stop-all:
    cmds:
      - task: stop
      - task: stop-postgres

  start-all:
    cmds:
      - task: start-postgres
      - task: start

  list-backup:
    cmds:
      - task: list-data-backup
      - task: list-postgres-backup

  list-data-backup:
    env:
      BACKUP_SECRET:
        sh: |
          aws ssm get-parameter --name /kubernetes/immich-public/backup \
          --query "Parameter.Value" --with-decryption
      OPENDAL_ENDPOINT: "https://s3.us-east-005.backblazeb2.com"
      OPENDAL_BUCKET:
        sh: echo $BACKUP_SECRET | jq -r 'fromjson | .OPENDAL_BUCKET'
      OPENDAL_ROOT: /app
      OPENDAL_ACCESS_KEY_ID:
        sh: echo $BACKUP_SECRET | jq -r 'fromjson | .OPENDAL_ACCESS_KEY_ID'
      OPENDAL_SECRET_ACCESS_KEY:
        sh: echo $BACKUP_SECRET | jq -r 'fromjson | .OPENDAL_SECRET_ACCESS_KEY'
      RUSTIC_PASSWORD:
        sh: echo $BACKUP_SECRET | jq -r 'fromjson | .RUSTIC_PASSWORD'
    cmds:
      - |
          echo "Listing immich-public-data snapshots..."
          rustic snapshots -r "opendal:s3" --log-level=error

  list-postgres-backup:
    env:
      BACKUP_SECRET:
        sh: |
          aws ssm get-parameter --name /amethyst/immich-public-postgres \
          --query "Parameter.Value" --with-decryption
      S3_ENDPOINT_URL: https://s3.us-east-005.backblazeb2.com
      POSTGRES_REPO: s3://timtor-homelab-immich-public/immich-public-postgres/base/
      AWS_ACCESS_KEY_ID:
        sh: echo $BACKUP_SECRET | jq -r 'fromjson | .POSTGRES_B2_ACCESS_KEY_ID'
      AWS_SECRET_ACCESS_KEY:
        sh: echo $BACKUP_SECRET | jq -r 'fromjson | .POSTGRES_B2_ACCESS_SECRET_KEY'
    cmds:
      - |
          echo "Listing immich-public-postgres backups..."
          aws s3 ls --endpoint-url="$S3_ENDPOINT_URL" "$POSTGRES_REPO" | tr -s ' '
