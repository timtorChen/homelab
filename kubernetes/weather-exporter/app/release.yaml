---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  namespace: weather-exporter
  name: weather-exporter
spec:
  chart:
    spec:
      sourceRef:
        kind: HelmRepository
        name: bjw-s
      chart: app-template
      version: 5.3.0
  interval: 1h
  maxHistory: 1
  timeout: 1m0s
  values:
    global:
      createDefaultServiceAccount: false

    controllers:
      main:
        type: deployment
        replicas: 1
        strategy: RollingUpdate
        serviceAccount:
          name: weather-exporter
        annotations:
          secret.reloader.stakater.com/reload: &secret weather-exporter-secret
          configmap.reloader.stakater.com/reload: &config vector-config
        pod:
          automountServiceAccountToken: false
          securityContext:
            fsGroup: 65534
        containers:
          main:
            image:
              repository: billykwooten/openweather-exporter
              tag: v0.0.14
            env:
              OW_LISTEN_ADDRESS: ":9091"
              OW_CACHE_TTL: "300"
              OW_APIKEY:
                valueFrom:
                  secretKeyRef:
                    name: *secret
                    key: OW_APIKEY
            ports:
              - name: http
                containerPort: 9091
                protocol: TCP
            probes:
              startup:
                enabled: false
              liveness:
                enabled: false
              readiness:
                enabled: false
            resources:
              limits:
                memory: 64Mi
              requests:
                cpu: 10m
                memory: 64Mi
            securityContext: &security-context
              runAsNonRoot: true
              runAsUser: 65534
              runAsGroup: 65534
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
              seccompProfile:
                type: RuntimeDefault

          vector:
            image:
              repository: timberio/vector
              tag: 0.59.0-distroless-libc
            env:
              VECTOR_CONFIG_DIR: /etc/vector
            resources:
              limits:
                memory: 128Mi
              requests:
                cpu: 10m
                memory: 64Mi
            probes:
              startup:
                enabled: false
              liveness:
                enabled: false
              readiness:
                enabled: false
            securityContext: *security-context

    persistence:
      config:
        type: configMap
        name: *config
        globalMounts:
          - path: /etc/vector
            readOnly: true
