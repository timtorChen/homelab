---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/secrets-store.csi.x-k8s.io/secretproviderclass_v1.json
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  namespace: grafana
  name: &name grafana-secret
spec:
  provider: aws
  parameters:
    region: us-west-2
    objects: |
      - objectType: ssmparameter
        objectName: /amethyst/grafana
        jmesPath:
          - path: ADMIN_USER
            objectAlias: ADMIN_USER
          - path: ADMIN_PASSWORD
            objectAlias: ADMIN_PASSWORD
          - path: POSTGRES_URL
            objectAlias: POSTGRES_URL
          - path: ENTRA_APP_GRAFANA_APPLICATION_ID
            objectAlias: ENTRA_APP_GRAFANA_APPLICATION_ID
          - path: ENTRA_APP_GRAFANA_APPLICATION_SECRET
            objectAlias: ENTRA_APP_GRAFANA_APPLICATION_SECRET
  secretObjects:
    - secretName: *name
      type: Opaque
      data:
        - key: ADMIN_USER
          objectName: ADMIN_USER
        - key: ADMIN_PASSWORD
          objectName: ADMIN_PASSWORD
        - key: POSTGRES_URL
          objectName: POSTGRES_URL
        - key: ENTRA_APP_GRAFANA_APPLICATION_ID
          objectName: ENTRA_APP_GRAFANA_APPLICATION_ID
        - key: ENTRA_APP_GRAFANA_APPLICATION_SECRET
          objectName: ENTRA_APP_GRAFANA_APPLICATION_SECRET
