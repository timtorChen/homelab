---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/external-secrets.io/secretstore_v1.json
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  namespace: grafana
  name: grafana
spec:
  provider:
    aws:
      service: ParameterStore
      region: us-west-2
      auth:
        jwt:
          serviceAccountRef:
            name: grafana
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  namespace: grafana
  name: grafana-secret
spec:
  refreshInterval: "24h"
  secretStoreRef:
    kind: SecretStore
    name: grafana
  refreshPolicy: OnChange
  target:
    name: grafana-secret
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: ADMIN_USER
      remoteRef:
        key: /amethyst/grafana
        property: ADMIN_USER
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: /amethyst/grafana
        property: ADMIN_PASSWORD
    - secretKey: POSTGRES_URL
      remoteRef:
        key: /amethyst/grafana
        property: POSTGRES_URL
    - secretKey: ENTRA_APP_GRAFANA_APPLICATION_ID
      remoteRef:
        key: /amethyst/grafana
        property: ENTRA_APP_GRAFANA_APPLICATION_ID
    - secretKey: ENTRA_APP_GRAFANA_APPLICATION_SECRET
      remoteRef:
        key: /amethyst/grafana
        property: ENTRA_APP_GRAFANA_APPLICATION_SECRET
