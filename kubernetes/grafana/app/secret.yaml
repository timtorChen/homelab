---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/external-secrets.io/secretstore_v1.json
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  namespace: grafana
  name: grafana
spec:
  provider:
    aws:
      service: ParameterStore
      region: us-west-2
      auth:
        jwt:
          serviceAccountRef:
            name: grafana
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  namespace: grafana
  name: grafana-secret
spec:
  refreshInterval: "24h"
  secretStoreRef:
    kind: SecretStore
    name: grafana
  refreshPolicy: OnChange
  target:
    name: grafana-secret
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      data:
        ADMIN_USER: "{{ .ADMIN_USER }}"
        ADMIN_PASSWORD: "{{ .ADMIN_PASSWORD }}"
        POSTGRES_URL: "{{ .POSTGRES_URL }}"
        JUMPCLOUD_OIDC_CLIENT_ID: "{{ .JUMPCLOUD_OIDC_CLIENT_ID }}"
        JUMPCLOUD_OIDC_CLIENT_SECRET: "{{ .JUMPCLOUD_OIDC_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: /amethyst/grafana
