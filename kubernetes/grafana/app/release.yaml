---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  namespace: grafana
  name: grafana
spec:
  chart:
    spec:
      sourceRef:
        kind: HelmRepository
        namespace: grafana
        name: grafana-community
      chart: grafana
      version: 12.11.2
  interval: 1h
  maxHistory: 1
  values:
    replicas: 1
    serviceAccount:
      create: true
      annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::262264826613:role/amethyst-grafana
        eks.amazonaws.com/audience: sts.amazonaws.com
    podAnnotations:
      secret.reloader.stakater.com/reload: &s grafana-secret
    envFromSecrets:
      - name: *s
    extraSecretMounts:
      - name: *s
        mountPath: /grafana-secret
        readOnly: true
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: *s

    ## admin username and password cannot be declaratively change after creation
    admin:
      existingSecret: *s
      userKey: ADMIN_USER
      passwordKey: ADMIN_PASSWORD

    grafana.ini:
      log:
        ## Debug, change to level: debug
        level: info
      auth:
        ## Debug, change to disable_login_form: false to enable password login while SSO failed
        disable_login_form: true
      server:
        root_url: https://grafana.timtor.dev
      live:
        allowed_origins: https://grafana.timtor.dev
      analytics:
        check_for_updates: false
        reporting_enabled: false
      database:
        type: postgres
        name: grafana
        url: ${POSTGRES_URL}
      auth.anonymous:
        enabled: true
        org_name: Public
        org_role: Viewer
        hide_version: true
      auth.generic_oauth:
        enabled: true
        allow_sign_up: true
        auto_login: false
        name: Microsoft Entra ID
        client_id: ${ENTRA_APP_GRAFANA_APPLICATION_ID}
        client_secret: ${ENTRA_APP_GRAFANA_APPLICATION_SECRET}
        auth_url: https://login.microsoftonline.com/a5ccdd11-d4cc-424b-ab4a-6bef963f831c/oauth2/v2.0/authorize
        token_url: https://login.microsoftonline.com/a5ccdd11-d4cc-424b-ab4a-6bef963f831c/oauth2/v2.0/token
        api_url: https://graph.microsoft.com/oidc/userinfo
        scopes: openid email profile
        ## Roles
        allow_assign_grafana_admin: true
        ## Azure group object IDs
        role_attribute_path: >
          contains(groups[*], 'c435397e-09e6-4311-b8d0-b7096e2a82b6') && 'GrafanaAdmin' ||
          contains(groups[*], 'c547fbbe-6c98-41b3-8a49-3f2bad80a8f1') && 'GrafanaAdmin' ||
          contains(groups[*], 'f65ea526-e6b9-41ba-a7db-1b1ffe036e75') && 'Admin' ||
          contains(groups[*], '66842db9-5502-4e72-a13b-3ba18011486d') && 'Editor' ||
          contains(groups[*], '5cf92c04-9a8b-4f97-9a96-fc7c148fb209') && 'Viewer' ||
          'no-sorry-not-you'
        role_attribute_strict: true
        skip_org_role_sync: false
      unified_alerting:
        enabled: true
        ha_listen_address: ${POD_IP}:9094
        ha_peers: grafana-alerting:9094
        ha_advertise_address: ${POD_IP}:9094
        ha_peer_timeout: 15s

    plugins:
      - grafana-synthetic-monitoring-app
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - &mimir
            orgId: 1
            name: mimir-amethyst
            access: proxy
            type: prometheus
            url: http://mimir-query-frontend.mimir:8080/prometheus
            jsonData:
              timeInterval: 1m
            isDefault: false
            editable: true
          - &loki
            orgId: 1
            name: loki-amethyst
            access: proxy
            type: loki
            url: http://loki-read.loki:3100
            isDefault: false
            editable: true
          - <<: *mimir
            orgId: 3
          - <<: *loki
            orgId: 3

    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  namespace: grafana
  name: grafana-alerting
  labels:
    app.kubernetes.io/part-of: grafana
    app.kubernetes.io/name: grafana-alerting
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: gossip-tcp
      protocol: TCP
      port: 9094
      targetPort: 9094
    - name: gossip-udp
      protocol: UDP
      port: 9094
      targetPort: 9094
  selector:
    app.kubernetes.io/name: grafana
